name: test

on:
  pull_request:
    paths: ["scripts/labbook/**", ".github/workflows/test.yml"]

jobs:
  labbook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=scripts/labbook python3 -m unittest discover -s scripts/labbook/tests -v
