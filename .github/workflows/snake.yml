name: snake

# Draws the contribution-grid snake and publishes it to the `output` branch,
# which README.md reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: "0 18 * * *" # daily, 02:00 Taiwan time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4a78a6&color_dots=#ebedf0,#e8b4c0,#c25270,#9f1239,#6b1030
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a6cdec&color_dots=#161b22,#3f0a1d,#6b1030,#9f1239,#c9405f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
