name: snake

# Draws the contribution-grid snake and publishes it to the `output` branch,
# which README.md reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: "0 18 * * *" # daily, 02:00 Taiwan time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#14151a&color_dots=#ebe6dc,#f6cdb0,#f39a64,#e5421a,#a82c0f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#97dbd9&color_dots=#12141b,#3a1a14,#8a3319,#ff5b2b,#ffd183

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
