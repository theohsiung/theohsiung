name: snake

# Draws the contribution-grid snake and publishes it to the `output` branch,
# which README.md reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: "0 18 * * *" # daily, 02:00 Taiwan time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#53a548&color_dots=#f8faf0,#d6e681,#91cb3e,#53a548,#19381f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#eee82c&color_dots=#1f4227,#2f5a36,#4c934c,#91cb3e,#eee82c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
