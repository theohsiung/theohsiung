name: snake

# Draws the contribution-grid snake and publishes it to the `output` branch,
# which README.md reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: "0 18 * * *" # daily, 02:00 Taiwan time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0f8f84&color_dots=#ebedf0,#a7f3d0,#5eead4,#14b8a6,#0f766e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f59e0b&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#2dd4bf

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
