<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Theo Hsiung</title>
  <desc id="d">AI for Science, LLM systems and agentic infrastructure. A research loop: propose, simulate, diagnose, hypothesize, with every result committed to git.</desc>
  <!-- Generated by scripts/banner.py; edit the palette there, not here. -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d8dee4"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#881337"/>
      <stop offset=".55" stop-color="#be123c"/>
      <stop offset="1" stop-color="#f2cc8f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#881337" stop-opacity=".45"/>
      <stop offset="1" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font: 700 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; letter-spacing: -1px; }
      .tag  { font: 600 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #881337; }
      .sub  { font: 400 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
      .lbl  { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328;
               animation: label 8s ease-out infinite; }
      .core { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
      .hash { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #881337; opacity: 0;
               animation: hash 32s linear infinite; }
      .h0 { opacity: 1; }

      .orbit  { transform-origin: 940px 160px; animation: spin 8s linear infinite; }
      .node   { opacity: .45; transform-box: fill-box; transform-origin: center; animation: flash 8s ease-out infinite; }
      .ripple { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ripple 8s ease-out infinite; }
      .tok    { fill: #be123c; fill-opacity: .4; animation: token 4s ease-in-out infinite; }
      .caret  { animation: blink 1.1s steps(1) infinite; }
      .sweep  { animation: sweep 6s ease-in-out infinite; }

      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes flash  { 0% { opacity: 1; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 35%, 100% { opacity: .45; transform: scale(1); } }
      @keyframes label  { 0%, 14% { fill: #881337; } 35%, 100% { fill: #1f2328; } }
      @keyframes ripple { 0% { opacity: .7; transform: scale(1); } 30% { opacity: 0; transform: scale(1.8); } 100% { opacity: 0; } }
      @keyframes hash   { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes token  { 0%, 100% { fill-opacity: .4; } 12%, 30% { fill-opacity: 1; } 50% { fill-opacity: .4; } }
      @keyframes blink  { 50% { opacity: 0; } }
      @keyframes sweep  { 0% { transform: translateX(-260px); } 60%, 100% { transform: translateX(1260px); } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .node { opacity: 1; }
        .tok { fill-opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#ffffff"/>
  <rect width="1200" height="320" rx="16" fill="url(#dots)"/>
  <g clip-path="url(#round)">
    <rect width="1200" height="4" fill="url(#bar)"/>
    <rect class="sweep" width="260" height="4" fill="url(#shine)"/>
  </g>

  <!-- identity -->
  <text x="64" y="122" class="name">Theo Hsiung</text>
  <text x="66" y="164" class="tag">AI for Science · LLM Systems · Agentic Infra</text>
  <text x="66" y="196" class="sub">Associate Research Scientist, vLLM Semantic Router · Delta Electronics · Taiwan</text>
  <text x="66" y="262" class="mono">$ route <tspan class="tok" style="animation-delay:0.0s">signal</tspan> → <tspan class="tok" style="animation-delay:0.5s">decision</tspan> → <tspan class="tok" style="animation-delay:1.0s">algorithm</tspan> → <tspan class="tok" style="animation-delay:1.5s">model</tspan><tspan class="caret" fill="#881337"> ▍</tspan></text>

  <!-- research loop: one lap = 8s -->
  <circle cx="940" cy="160" r="96" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 6"/>
  <g class="orbit">
    <circle cx="940" cy="160" r="96" fill="none" stroke="#881337" stroke-width="3" stroke-linecap="round" opacity="0.12" stroke-dasharray="150.0 603.2" transform="rotate(-179.52 940 160)"/>
    <circle cx="940" cy="160" r="96" fill="none" stroke="#881337" stroke-width="3" stroke-linecap="round" opacity="0.25" stroke-dasharray="90.0 603.2" transform="rotate(-143.71 940 160)"/>
    <circle cx="940" cy="160" r="96" fill="none" stroke="#881337" stroke-width="4" stroke-linecap="round" opacity="0.5" stroke-dasharray="45.0 603.2" transform="rotate(-116.86 940 160)"/>
    <circle cx="940" cy="64" r="18" fill="url(#glow)"/>
    <circle cx="940" cy="64" r="6" fill="#881337"/>
  </g>

  <circle class="ripple" cx="940" cy="160" r="40" fill="none" stroke="#881337" stroke-width="2"/>
  <circle cx="940" cy="160" r="40" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="940" y="156" text-anchor="middle" class="core">git commit</text>
  <text class="hash h0" style="animation-delay:0s" x="940" y="174" text-anchor="middle">a3f9c1e</text>
  <text class="hash" style="animation-delay:8s" x="940" y="174" text-anchor="middle">7be20d4</text>
  <text class="hash" style="animation-delay:16s" x="940" y="174" text-anchor="middle">e51c8a0</text>
  <text class="hash" style="animation-delay:24s" x="940" y="174" text-anchor="middle">0c4d7f2</text>

  <circle class="node" style="animation-delay:0.0s" cx="940" cy="64" r="5" fill="#be123c"/>
  <circle class="node" style="animation-delay:2.0s" cx="1036" cy="160" r="5" fill="#be123c"/>
  <circle class="node" style="animation-delay:4.0s" cx="940" cy="256" r="5" fill="#be123c"/>
  <circle class="node" style="animation-delay:6.0s" cx="844" cy="160" r="5" fill="#be123c"/>
  <text class="lbl" style="animation-delay:0.0s" x="940" y="44" text-anchor="middle">propose</text>
  <text class="lbl" style="animation-delay:2.0s" x="1052" y="165" text-anchor="start">simulate</text>
  <text class="lbl" style="animation-delay:4.0s" x="940" y="288" text-anchor="middle">diagnose</text>
  <text class="lbl" style="animation-delay:6.0s" x="828" y="165" text-anchor="end">hypothesize</text>
</svg>
